name: PyPI download stats

# Weekly, so trend data exists from day one rather than being reconstructed
# later from memory - pypistats.org only serves a rolling window, and
# scripts/pypi_downloads.py is what turns that into a permanent CSV.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/pypi_downloads.py
      - name: commit the updated CSV, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/pypi_downloads.csv
          if git diff --cached --quiet; then
            echo "no change this week"
          else
            git commit -m "pypi_downloads: weekly update"
            git push
          fi
