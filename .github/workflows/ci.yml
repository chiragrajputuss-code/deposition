name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The canonicalisation tests shell out to node and compare its output
      # against ours. Without node they skip, and a silently skipped
      # cross-language check is worth nothing - see ADR 008.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e '.[dev,viewer,signing]'
      - run: python -m pytest -q
      - name: the cross-language vectors must actually have run
        run: |
          python -m pytest tests/test_canonical.py -q -rs 2>&1 | tee out.txt
          if grep -q "skipped" out.txt; then
            echo "::error::RFC 8785 cross-check skipped - node missing or guard wrong"
            exit 1
          fi
      - name: the standalone verifier's openssl checks must actually have run
        run: |
          python -m pytest tests/test_verify_standalone.py tests/test_timestamp.py -q -rs 2>&1 | tee out.txt
          if grep -q "skipped" out.txt; then
            echo "::error::openssl cross-checks skipped (standalone signature or RFC 3161) - OpenSSL 3 missing or guard wrong"
            exit 1
          fi

  standalone-verifier:
    name: standalone verifier (no deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The promise is "verify with one file and a bare interpreter". Nothing is
      # installed in this job - not even this package - and the first step
      # proves it, because a check that quietly ran with deps is worth nothing.
      - name: the interpreter really is bare
        run: |
          for module in cryptography deposition; do
            if python -c "import $module" 2>/dev/null; then
              echo "::error::$module is importable - this job must run with nothing installed"
              exit 1
            fi
          done
          openssl version | grep -q "^OpenSSL 3" || { echo "::error::needs OpenSSL 3"; exit 1; }
      - name: verifies the demo trace, then openssl checks its signature
        run: |
          python -I scripts/verify_standalone.py src/deposition/_demo/run_demo.jsonl \
            --pubkey src/deposition/_demo/run_demo.pem.pub --json > out.json
          cmd=$(python -c "import json; print(json.load(open('out.json'))[0]['openssl_command'] or '')")
          if [ -z "$cmd" ]; then
            echo "::error::no openssl command printed - the fallback did not run"; exit 1
          fi
          eval "$cmd"
      - name: an edited event body exits 1
        run: |
          cp src/deposition/_demo/run_demo.jsonl edited.jsonl
          sed -i '3s/demo-model-1/demo-model-2/' edited.jsonl
          set +e
          python -I scripts/verify_standalone.py edited.jsonl
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 for an edited trace, got $code"; exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts

  no-dependencies:
    name: installs with zero dependencies (ADR 003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The promise is that the recorder installs and records with nothing but
      # the standard library. A test suite cannot check this, because the suite
      # needs its own dependencies - only a bare install can.
      - run: pip install .
      - name: nothing but the standard library arrived
        run: |
          installed=$(pip list --format=freeze --exclude-editable | grep -v "^deposition==" | grep -v "^pip==" | grep -v "^setuptools==" | grep -v "^wheel==" || true)
          if [ -n "$installed" ]; then
            echo "::error::deposition pulled in dependencies:"; echo "$installed"; exit 1
          fi
          echo "clean: no third-party packages installed"
      - name: it records and verifies on a bare install
        run: |
          python examples/01_minimal.py
          deposition verify ./deposition/run_*.jsonl
