<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postflight — replay</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --line: #e6e4e0; --ink: #1b1a18;
  --muted: #6f6b66; --faint: #9a958e; --accent: #2f6f5e; --accent-soft: #e8f1ee;
  --ok: #2f6f5e; --bad: #a8352c; --bad-soft: #fbeceb; --warn: #8a6a1f;
  --code-bg: #f5f4f1;
  --t-llm: #3d5a99; --t-tool: #7a5195; --t-decision: #b06a20;
  --t-error: #a8352c; --t-retrieval: #2f6f5e; --t-meta: #6f6b66;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #1e2023; --line: #2f3338; --ink: #e8e6e3;
    --muted: #9b9790; --faint: #6f6b66; --accent: #6fbfa4; --accent-soft: #1d2b28;
    --ok: #6fbfa4; --bad: #e0837a; --bad-soft: #2b1e1d; --warn: #d4ae5e;
    --code-bg: #16181a;
    --t-llm: #8fa8dd; --t-tool: #bf9bd6; --t-decision: #d9a35e;
    --t-error: #e0837a; --t-retrieval: #6fbfa4; --t-meta: #9b9790;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }

/* header */
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-weight: 650; letter-spacing: -0.01em; }
.brand span { color: var(--faint); font-weight: 400; }
.runid { font-size: 13px; color: var(--muted); }
.spacer { flex: 1; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent;
}
.badge.ok { background: var(--accent-soft); color: var(--ok); border-color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.stat { font-size: 12px; color: var(--muted); }
.stat b { color: var(--ink); font-weight: 600; }

/* layout */
main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } #detail { border-left: 0; } }

/* timeline */
#timeline { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
.ev {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: baseline;
  padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  border-left: 3px solid transparent;
}
.ev:hover { background: var(--bg); }
.ev.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.ev.caused { border-left-color: var(--warn); }
.ev .seq { color: var(--faint); font-size: 11px; text-align: right; }
.ev .label { min-width: 0; }
.ev .type { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.ev .name { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.ev .ms { font-size: 11px; color: var(--faint); }
.t-llm_call { color: var(--t-llm); } .t-tool_call { color: var(--t-tool); }
.t-decision { color: var(--t-decision); } .t-error { color: var(--t-error); }
.t-retrieval { color: var(--t-retrieval); }
.t-run_start, .t-run_end, .t-annotation { color: var(--t-meta); }

/* detail */
#detail { overflow-y: auto; padding: 18px 22px 60px; }
.dh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.dh h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
.dh .ts { color: var(--faint); font-size: 12px; }
.tabs { display: flex; gap: 2px; margin: 16px 0 0; border-bottom: 1px solid var(--line); }
.tab {
  padding: 7px 13px; font-size: 13px; cursor: pointer; color: var(--muted);
  border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0;
  margin-bottom: -1px; background: none;
}
.tab.on { color: var(--ink); background: var(--panel); border-color: var(--line); font-weight: 600; }
pre {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 0 8px 8px 8px;
  padding: 14px; overflow-x: auto; margin: 0; font-size: 12.5px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}
.why { margin-top: 20px; }
.why h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin: 0 0 8px; font-weight: 650; }
.chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 5px 9px; font-size: 12px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.arrow { color: var(--faint); }
.hashline { margin-top: 20px; font-size: 11.5px; color: var(--faint); }
.hashline b { color: var(--muted); font-weight: 600; }
.blobbtn {
  border: 1px solid var(--line); background: var(--panel); color: var(--accent);
  border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; margin-top: 8px;
}
.problems { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--bad);
  border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
.problems ul { margin: 6px 0 0; padding-left: 18px; }
.empty { color: var(--faint); padding: 40px 0; text-align: center; }
footer { border-top: 1px solid var(--line); padding: 7px 20px; font-size: 11.5px;
  color: var(--faint); background: var(--panel); }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; font-size: 11px; font-family: inherit; }
</style>
</head>
<body>
<header>
  <div class="brand">Postflight <span>replay</span></div>
  <div class="runid mono" id="runid">loading…</div>
  <div class="spacer"></div>
  <div class="stat" id="totals"></div>
  <div id="integrity"></div>
</header>

<main>
  <div id="timeline"></div>
  <div id="detail"><div class="empty">Select a step, or press <kbd>j</kbd></div></div>
</main>

<footer>
  <kbd>j</kbd>/<kbd>k</kbd> next / previous step · <kbd>g</kbd>/<kbd>G</kbd> first / last ·
  <kbd>r</kbd> reload trace
</footer>

<script>
const $ = (s) => document.querySelector(s);
let TRACE = null, SELECTED = 0, TAB = 0;

const NAME_KEYS = ["tool", "label", "gen_ai.request.model", "model", "agent", "query",
                   "exception", "status", "note"];

function stepName(ev) {
  const b = ev.body || {};
  for (const k of NAME_KEYS) if (typeof b[k] === "string" && b[k]) return b[k];
  return "";
}

// Which part of a body is "what went in" vs "what came out" depends on the event
// type; everything unrecognised falls back to showing the whole body.
function panes(ev) {
  const b = ev.body || {};
  switch (ev.type) {
    case "llm_call":
      return [["Input", pick(b, ["messages", "request", "provider", "gen_ai.request.model"])],
              ["Output", pick(b, ["response", "usage", "cost_usd", "latency_ms"])],
              ["Raw", b]];
    case "tool_call":
      return [["Arguments", pick(b, ["tool", "arguments"])],
              ["Result", pick(b, ["result", "error", "latency_ms"])],
              ["Raw", b]];
    case "retrieval":
      return [["Query", pick(b, ["query", "source"])],
              ["Documents", pick(b, ["doc_ids", "documents"])],
              ["Raw", b]];
    default:
      return [["Body", b], ["Raw", ev]];
  }
}

function pick(obj, keys) {
  const out = {};
  for (const k of keys) if (k in obj) out[k] = obj[k];
  return Object.keys(out).length ? out : obj;
}

function fmt(value) { return JSON.stringify(value, null, 2); }

function blobsIn(value, found = []) {
  if (value && typeof value === "object") {
    if (value.$blob) found.push(value.$blob);
    else for (const v of Object.values(value)) blobsIn(v, found);
  }
  return found;
}

function renderHeader() {
  const { run, integrity, trace } = TRACE;
  $("#runid").textContent = [run.run_id, run.agent && `· ${run.agent}`, `· ${trace.name}`]
    .filter(Boolean).join(" ");
  const t = run.totals || {};
  const bits = [];
  if (t.steps != null) bits.push(`<b>${t.steps}</b> steps`);
  if (t.tokens) bits.push(`<b>${t.tokens.toLocaleString()}</b> tokens`);
  if (t.cost_usd) bits.push(`<b>$${Number(t.cost_usd).toFixed(4)}</b>`);
  if (t.duration_ms) bits.push(`<b>${(t.duration_ms / 1000).toFixed(2)}s</b>`);
  if (run.status) bits.push(`status <b>${run.status}</b>`);
  $("#totals").innerHTML = bits.join(" · ");

  const ok = integrity.ok;
  $("#integrity").innerHTML =
    `<span class="badge ${ok ? "ok" : "bad"}" title="${
      ok ? "Hash chain verified end to end" : "This trace was altered after it was written"}">
      <span class="dot"></span>${ok ? "chain verified" : "chain broken"}
     </span>`;
}

function renderTimeline() {
  const causes = new Set(TRACE.events[SELECTED]?.caused_by || []);
  $("#timeline").innerHTML = TRACE.events.map((ev, i) => `
    <div class="ev ${i === SELECTED ? "sel" : ""} ${causes.has(ev.seq) ? "caused" : ""}"
         data-i="${i}">
      <div class="seq mono">${ev.seq}</div>
      <div class="label">
        <div class="type t-${ev.type}">${ev.type.replace("_", " ")}</div>
        <span class="name">${escapeHtml(stepName(ev))}</span>
      </div>
      <div class="ms">${ev.body?.latency_ms != null
        ? Math.round(ev.body.latency_ms) + "ms" : ""}</div>
    </div>`).join("");
  const sel = $("#timeline .ev.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

function renderDetail() {
  const ev = TRACE.events[SELECTED];
  if (!ev) return;
  const tabs = panes(ev);
  TAB = Math.min(TAB, tabs.length - 1);
  const shown = tabs[TAB][1];

  const problems = TRACE.integrity.errors.filter((e) => e.seq === ev.seq);
  const blobs = blobsIn(shown);

  $("#detail").innerHTML = `
    ${problems.length ? `<div class="problems"><b>This step failed verification.</b>
      <ul>${problems.map((p) => `${escapeHtml(p.code)} — ${escapeHtml(p.message)}`)
        .map((s) => `<li>${s}</li>`).join("")}</ul></div>` : ""}
    <div class="dh">
      <h2 class="t-${ev.type}">${ev.type.replace("_", " ")} ${escapeHtml(stepName(ev))}</h2>
      <span class="ts mono">seq ${ev.seq} · ${escapeHtml(ev.ts)}</span>
    </div>
    <div class="tabs">${tabs.map(([name], i) =>
      `<button class="tab ${i === TAB ? "on" : ""}" data-tab="${i}">${name}</button>`).join("")}</div>
    <pre>${escapeHtml(fmt(shown))}</pre>
    ${blobs.map((d) => `<button class="blobbtn" data-blob="${d}">
        load blob ${d.slice(0, 12)}…</button>`).join(" ")}
    <div class="blobout"></div>
    ${renderWhy(ev)}
    <div class="hashline mono">
      <b>hash</b> ${escapeHtml(ev.hash || "")}<br>
      <b>prev</b> ${escapeHtml(ev.prev_hash || "")}
    </div>`;
}

// The causal chain is the differentiator: walk caused_by backwards so "why did
// this happen?" is one glance rather than a scroll through the whole run.
function renderWhy(ev) {
  const chain = [];
  const seen = new Set();
  let cursor = ev;
  while (cursor && cursor.caused_by && cursor.caused_by.length && !seen.has(cursor.seq)) {
    seen.add(cursor.seq);
    const parentSeq = cursor.caused_by[cursor.caused_by.length - 1];
    const parent = TRACE.events.find((e) => e.seq === parentSeq);
    if (!parent) break;
    chain.unshift(parent);
    cursor = parent;
  }
  if (!chain.length) return "";
  const chip = (e) => `<button class="chip" data-goto="${e.seq}">
      <span class="t-${e.type}">${e.type.replace("_", " ")}</span>
      ${escapeHtml(stepName(e))} <span class="mono">#${e.seq}</span></button>`;
  return `<div class="why"><h3>why this happened</h3><div class="chain">
      ${chain.map(chip).join('<span class="arrow">→</span>')}
      <span class="arrow">→</span>
      <button class="chip" data-goto="${ev.seq}"><b>this step</b></button>
    </div></div>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function select(i) {
  if (!TRACE || i < 0 || i >= TRACE.events.length) return;
  SELECTED = i; TAB = 0;
  renderTimeline(); renderDetail();
}

document.addEventListener("click", async (e) => {
  const ev = e.target.closest(".ev");
  if (ev) return select(Number(ev.dataset.i));
  const tab = e.target.closest(".tab");
  if (tab) { TAB = Number(tab.dataset.tab); return renderDetail(); }
  const goto = e.target.closest("[data-goto]");
  if (goto) {
    const seq = Number(goto.dataset.goto);
    return select(TRACE.events.findIndex((x) => x.seq === seq));
  }
  const blob = e.target.closest("[data-blob]");
  if (blob) {
    blob.disabled = true; blob.textContent = "loading…";
    const text = await fetch(`/api/blob/${blob.dataset.blob}`).then((r) =>
      r.ok ? r.text() : "blob not found next to this trace");
    const out = document.createElement("pre");
    out.textContent = text;
    blob.replaceWith(out);
  }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j") select(SELECTED + 1);
  else if (e.key === "k") select(SELECTED - 1);
  else if (e.key === "g") select(0);
  else if (e.key === "G") select(TRACE.events.length - 1);
  else if (e.key === "r") load();
  else return;
  e.preventDefault();
});

async function load() {
  TRACE = await fetch("/api/trace").then((r) => r.json());
  renderHeader();
  if (!TRACE.events.length) {
    $("#timeline").innerHTML = '<div class="empty">no events in this trace</div>';
    return;
  }
  select(Math.min(SELECTED, TRACE.events.length - 1));
}

load();
</script>
</body>
</html>
