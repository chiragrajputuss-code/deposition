<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deposition — replay</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --line: #e6e4e0; --ink: #1b1a18;
  --muted: #6f6b66; --faint: #9a958e; --accent: #2f6f5e; --accent-soft: #e8f1ee;
  --ok: #2f6f5e; --bad: #a8352c; --bad-soft: #fbeceb; --warn: #8a6a1f;
  --warn-soft: #faf3e2;
  --code-bg: #f5f4f1;
  --t-llm: #3d5a99; --t-tool: #7a5195; --t-decision: #b06a20;
  --t-error: #a8352c; --t-retrieval: #2f6f5e; --t-meta: #6f6b66;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #1e2023; --line: #2f3338; --ink: #e8e6e3;
    --muted: #9b9790; --faint: #6f6b66; --accent: #6fbfa4; --accent-soft: #1d2b28;
    --ok: #6fbfa4; --bad: #e0837a; --bad-soft: #2b1e1d; --warn: #d4ae5e;
    --warn-soft: #2a2416;
    --code-bg: #16181a;
    --t-llm: #8fa8dd; --t-tool: #bf9bd6; --t-decision: #d9a35e;
    --t-error: #e0837a; --t-retrieval: #6fbfa4; --t-meta: #9b9790;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }

/* header */
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-weight: 650; letter-spacing: -0.01em; }
.brand span { color: var(--faint); font-weight: 400; }
.runid { font-size: 13px; color: var(--muted); }
.spacer { flex: 1; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent;
}
.badge.ok { background: var(--accent-soft); color: var(--ok); border-color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }

/* Three claims, never one. The chain, the signature and the recorder's own
   count of what it lost answer different questions, and a single green light
   that blends them is the failure this panel exists to prevent. */
.claims { display: flex; flex-wrap: wrap; gap: 6px; }
.claim {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px;
  border-radius: 999px; font-size: 12px; border: 1px solid var(--line);
  background: var(--panel); cursor: help;
}
.claim .k { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.claim .v { font-weight: 600; }
.claim.ok .v { color: var(--ok); }
.claim.bad .v { color: var(--bad); }
.claim.warn .v { color: var(--warn); }
.claim.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.claim.bad { border-color: var(--bad); background: var(--bad-soft); }
.claim.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-soft); }
.claimnote {
  font-size: 11.5px; color: var(--muted); margin-top: 6px; max-width: 78ch;
}
.stat { font-size: 12px; color: var(--muted); }
.stat b { color: var(--ink); font-weight: 600; }

/* layout */
main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } #detail { border-left: 0; } }

/* timeline */
#side { display: flex; flex-direction: column; min-height: 0;
        border-right: 1px solid var(--line); background: var(--panel); }
#side #viewbar { padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
#side #viewbar:empty { display: none; }
#timeline { flex: 1; overflow-y: auto; background: var(--panel); padding: 8px; }
.ev {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: baseline;
  padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  border-left: 3px solid transparent;
}
.ev:hover { background: var(--bg); }
.ev.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.ev.caused { border-left-color: var(--warn); }
.ev .seq { color: var(--faint); font-size: 11px; text-align: right; }
.ev .ms { white-space: nowrap; }
.ev .ctx { color: var(--faint); font-size: 10.5px; }
.ev .ctx b { color: var(--muted); font-weight: 600; }
#viewbar { display: flex; gap: 6px; padding: 0 0 10px; }
#viewbar button {
  font: inherit; font-size: 12px; cursor: pointer; padding: 5px 12px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--muted);
}
#viewbar button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ep {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  margin-bottom: 8px; overflow: hidden;
}
.ep > header {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
  padding: 10px 12px; cursor: pointer;
}
.ep > header:hover { background: var(--code-bg); }
.ep .q { font-size: 13px; font-weight: 600; }
.ep .meta { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted);
            font-variant-numeric: tabular-nums; }
.ep .meta b { color: var(--ink); font-weight: 600; }
.ep .meta .err { color: var(--bad); font-weight: 600; }
.ep .n { color: var(--faint); font-size: 11px; }
.mo {
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline;
  padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; font-size: 12px;
}
.mo:hover { background: var(--code-bg); }
.mo.sel { background: var(--accent-soft); }
.mo .k {
  font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
  padding: 1px 6px; border-radius: 3px; white-space: nowrap;
}
.mo .k.mutation { color: var(--t-decision); border: 1px solid var(--t-decision); }
.mo .k.error, .mo .k.violation { color: var(--bad); border: 1px solid var(--bad); }
.mo .k.spike { color: var(--warn); border: 1px solid var(--warn); }
.mo .k.tainted { color: var(--t-retrieval); border: 1px solid var(--t-retrieval); }
.mo .d { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mo .d b { font-weight: 600; }
.mo .s { color: var(--faint); font-size: 11px; }
.ep .more {
  display: block; width: 100%; text-align: left; font: inherit; font-size: 11.5px;
  color: var(--accent); background: none; border: 0; border-top: 1px solid var(--line);
  padding: 8px 12px; cursor: pointer;
}
.quiet { padding: 8px 12px; border-top: 1px solid var(--line);
         color: var(--faint); font-size: 11.5px; font-style: italic; }
.facts {
  display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 12px;
  padding: 9px 12px; background: var(--code-bg); border: 1px solid var(--line);
  border-radius: 6px; font-size: 12px;
}
.facts .f { white-space: nowrap; }
.facts .f span { color: var(--muted); margin-right: 5px; font-size: 11px; }
.facts .f b { font-weight: 600; font-variant-numeric: tabular-nums; }
.ev .label { min-width: 0; }
.ev .type { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.ev .name { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.ev .ms { font-size: 11px; color: var(--faint); }
.t-llm_call { color: var(--t-llm); } .t-tool_call { color: var(--t-tool); }
.t-decision { color: var(--t-decision); } .t-error { color: var(--t-error); }
.t-retrieval { color: var(--t-retrieval); }
.t-run_start, .t-run_end, .t-annotation { color: var(--t-meta); }

/* detail */
#detail { overflow-y: auto; padding: 18px 22px 60px; }
.dh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.dh h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
.dh .ts { color: var(--faint); font-size: 12px; }
.tabs { display: flex; gap: 2px; margin: 16px 0 0; border-bottom: 1px solid var(--line); }
.tab {
  padding: 7px 13px; font-size: 13px; cursor: pointer; color: var(--muted);
  border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0;
  margin-bottom: -1px; background: none;
}
.tab.on { color: var(--ink); background: var(--panel); border-color: var(--line); font-weight: 600; }
pre {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 0 8px 8px 8px;
  padding: 14px; overflow-x: auto; margin: 0; font-size: 12.5px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}
.why { margin-top: 20px; }
.why h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin: 0 0 8px; font-weight: 650; }
.chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 5px 9px; font-size: 12px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.arrow { color: var(--faint); }
.hashline { margin-top: 20px; font-size: 11.5px; color: var(--faint); }
.hashline b { color: var(--muted); font-weight: 600; }
.blobbtn {
  border: 1px solid var(--line); background: var(--panel); color: var(--accent);
  border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; margin-top: 8px;
}
.problems { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--bad);
  border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
.problems ul { margin: 6px 0 0; padding-left: 18px; }
.empty { color: var(--faint); padding: 40px 0; text-align: center; }
footer { border-top: 1px solid var(--line); padding: 7px 20px; font-size: 11.5px;
  color: var(--faint); background: var(--panel); }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; font-size: 11px; font-family: inherit; }
</style>
</head>
<body>
<header>
  <div class="brand">Deposition <span>replay</span></div>
  <div class="runid mono" id="runid">loading…</div>
  <div class="spacer"></div>
  <div class="stat" id="totals"></div>
  <div id="integrity"></div>
</header>

<main>
  <div id="side">
    <div id="viewbar"></div>
    <div id="timeline"></div>
  </div>
  <div id="detail"><div class="empty">Select a step, or press <kbd>j</kbd></div></div>
</main>

<footer>
  <kbd>j</kbd>/<kbd>k</kbd> next / previous step · <kbd>g</kbd>/<kbd>G</kbd> first / last ·
  <kbd>r</kbd> reload trace
</footer>

<script>
const $ = (s) => document.querySelector(s);
let TRACE = null, SELECTED = 0, TAB = 0;
// The lens: "chapters" leads with what mattered; "all" is the full record.
// A flat list is legible at fifty events and noise at a thousand, so the lens
// defaults by size - but the full record is always one click away, because the
// digest is a reading aid, never a substitute.
let VIEW = null;
const OPEN_EPISODES = new Set();

const NAME_KEYS = ["tool", "label", "gen_ai.request.model", "model", "agent", "query",
                   "exception", "status", "note"];

function stepName(ev) {
  const b = ev.body || {};
  for (const k of NAME_KEYS) if (typeof b[k] === "string" && b[k]) return b[k];
  return "";
}

// Which part of a body is "what went in" vs "what came out" depends on the event
// type; everything unrecognised falls back to showing the whole body.
function panes(ev) {
  const b = ev.body || {};
  switch (ev.type) {
    case "llm_call":
      return [["Input", pick(b, ["messages", "request", "provider", "gen_ai.request.model"])],
              ["Output", pick(b, ["response", "usage", "cost_usd", "latency_ms"])],
              ["Raw", b]];
    case "tool_call":
      return [["Arguments", pick(b, ["tool", "arguments"])],
              ["Result", pick(b, ["result", "error", "latency_ms"])],
              ["Raw", b]];
    case "retrieval":
      return [["Query", pick(b, ["query", "source"])],
              ["Documents", pick(b, ["doc_ids", "documents"])],
              ["Raw", b]];
    default:
      return [["Body", b], ["Raw", ev]];
  }
}

function pick(obj, keys) {
  const out = {};
  for (const k of keys) if (k in obj) out[k] = obj[k];
  return Object.keys(out).length ? out : obj;
}

function fmt(value) { return JSON.stringify(value, null, 2); }

function blobsIn(value, found = []) {
  if (value && typeof value === "object") {
    if (value.$blob) found.push(value.$blob);
    else for (const v of Object.values(value)) blobsIn(v, found);
  }
  return found;
}

function renderHeader() {
  const { run, integrity, trace } = TRACE;
  $("#runid").textContent = [run.run_id, run.agent && `· ${run.agent}`, `· ${trace.name}`]
    .filter(Boolean).join(" ");
  const t = run.totals || {};
  const bits = [];
  if (t.steps != null) bits.push(`<b>${t.steps}</b> steps`);
  if (t.tokens) bits.push(`<b>${t.tokens.toLocaleString()}</b> tokens`);
  if (t.cost_usd) bits.push(`<b>$${Number(t.cost_usd).toFixed(4)}</b>`);
  if (t.duration_ms) bits.push(`<b>${(t.duration_ms / 1000).toFixed(2)}s</b>`);
  if (run.status) bits.push(`status <b>${run.status}</b>`);
  $("#totals").innerHTML = bits.join(" · ");

  $("#integrity").innerHTML = renderClaims();
}

// What this trace supports, as three separate claims.
//
// "Verified" has to mean something a reader can act on, so each claim names the
// question it answers and nothing more. The chain says whether the file was
// altered after it was written. The signature says who wrote it - and says so
// only against a key the reader supplied, because a .sig file carries its own
// public key and whoever rewrites a trace can re-sign it. Completeness is what
// neither can reach: a chain has no gap when an event never arrived, so the
// recorder's own counts are the only evidence that anything is missing.
function renderClaims() {
  const { integrity, signature, completeness } = TRACE;

  const chain = integrity.ok
    ? { level: "ok", value: "intact", note: `${integrity.events_checked} events replayed; no edit, gap or reorder` }
    : { level: "bad", value: "broken", note: integrity.errors[0]?.message || "the chain does not hold" };

  const sig = (() => {
    const s = signature || {};
    if (s.status === "verified") return { level: "ok", value: "verified", note: s.message };
    if (s.status === "unpinned")
      return { level: "warn", value: "unverified key",
               note: "signed, but by a key that travelled with the trace. Re-open with --pubkey <key> to check it against the key you expect." };
    if (s.status === "unsigned")
      return { level: "warn", value: "unsigned",
               note: "no .sig file. Anyone holding this file can edit an event and re-seal the chain; only a signature would catch that." };
    if (s.status === "unavailable")
      return { level: "warn", value: "uncheckable", note: s.message };
    return { level: "bad", value: "failed", note: s.message || "the signature does not stand" };
  })();

  const whole = (() => {
    const c = completeness || {};
    if (c.status === "complete") return { level: "ok", value: "no known gaps", note: c.message };
    if (c.status === "inferred") return { level: "warn", value: `${c.adopted} inferred`, note: c.message };
    if (c.status === "lossy") return { level: "bad", value: `${c.dropped} dropped`, note: c.message };
    return { level: "bad", value: "truncated", note: c.message };
  })();

  const authority = (() => {
    const a = TRACE.authority || { status: "none" };
    if (a.status === "ok") return { level: "ok", value: "within mandate", note: a.message };
    if (a.status === "violations")
      return { level: "bad", value: `${a.count} violation${a.count === 1 ? "" : "s"}`, note: a.message };
    if (a.status === "not_attestable")
      return { level: "warn", value: "not attestable", note: a.message };
    // No mandate is the normal case, never an alarm.
    return { level: "", value: "none declared", note: a.message || "no mandate recorded" };
  })();

  const claims = [
    ["Not altered", chain],
    ["Authorship", sig],
    ["Completeness", whole],
    ["Authority", authority],
  ];

  const rated = claims.filter(([, c]) => c.level);
  const worst = rated.some(([, c]) => c.level === "bad") ? "bad"
    : rated.some(([, c]) => c.level === "warn") ? "warn" : "ok";
  const summary = {
    ok: "This trace can be shown to someone who does not trust you.",
    warn: "This trace is intact, but it does not yet prove who wrote it or that nothing is missing.",
    bad: "This trace is not evidence of what happened.",
  }[worst];

  return `<div class="claims">${claims.map(([label, c]) => `
      <span class="claim ${c.level}" title="${escapeHtml(c.note)}">
        <span class="k">${label}</span><span class="v">${escapeHtml(c.value)}</span>
      </span>`).join("")}
    </div>
    <div class="claimnote"><b>${escapeHtml(summary)}</b> ${escapeHtml(rated.find(([, c]) => c.level === worst)[1].note)}</div>`;
}

function digestUsable() {
  const d = TRACE.digest;
  return d && (d.episodes.length > 0 || d.moments.length > 0);
}

function renderViewbar() {
  if (!digestUsable()) { $("#viewbar").innerHTML = ""; return; }
  const d = TRACE.digest;
  $("#viewbar").innerHTML = `
    <button data-view="chapters" class="${VIEW === "chapters" ? "on" : ""}">
      What mattered${d.episodes.length ? ` · ${d.episodes.length} chapters` : ""}</button>
    <button data-view="all" class="${VIEW === "all" ? "on" : ""}">
      Everything · ${TRACE.events.length}</button>`;
}

function momentRow(m) {
  const selected = TRACE.events[SELECTED]?.seq === m.seq;
  return `<div class="mo ${selected ? "sel" : ""}" data-goto="${m.seq}">
    <span class="k ${m.kind}">${m.kind}</span>
    <span class="d"><b>${escapeHtml(m.label)}</b> ${escapeHtml(m.detail || "")}</span>
    <span class="s mono">#${m.seq}</span></div>`;
}

function renderChapters() {
  const d = TRACE.digest;
  const inRange = (m, ep) => m.seq >= ep.start && m.seq <= ep.end;
  const before = d.episodes.length ? d.moments.filter((m) => m.seq < d.episodes[0].start) : d.moments;

  let html = "";
  if (before.length) {
    html += `<div class="ep"><header><span class="q">Before the first prompt</span></header>
      ${before.map(momentRow).join("")}</div>`;
  }
  html += d.episodes.map((ep, i) => {
    const open = OPEN_EPISODES.has(i);
    const inside = d.moments.filter((m) => inRange(m, ep));
    const bits = [`<b>${ep.turns}</b> turns`, `<b>${ep.tools}</b> tools`];
    if (ep.mutations) bits.push(`<b>${ep.mutations}</b> changed things`);
    if (ep.errors) bits.push(`<span class="err">${ep.errors} failed</span>`);
    if (ep.tokens) bits.push(`<b>${ep.tokens >= 10000 ? (ep.tokens / 1000).toFixed(0) + "k" : ep.tokens}</b> tok`);
    return `<div class="ep">
      <header data-ep="${i}">
        <span class="q">${escapeHtml(ep.prompt)}</span>
        <span class="n mono">#${ep.start}–${ep.end}</span>
        <span class="meta">${bits.join(" · ")}${inside.length ? ` · ${inside.length} flagged` : ""}</span>
      </header>
      ${open ? (inside.map(momentRow).join("") || '<div class="quiet">nothing flagged in this chapter</div>') : ""}
      ${open ? `<button class="more" data-all="${ep.start}">all ${ep.end - ep.start + 1} events →</button>` : ""}
    </div>`;
  }).join("");
  $("#timeline").innerHTML = html;
}

function renderTimeline() {
  if (VIEW === null) {
    VIEW = digestUsable() && TRACE.events.length > 40 ? "chapters" : "all";
  }
  renderViewbar();
  if (VIEW === "chapters" && digestUsable()) { renderChapters(); return; }
  const causes = new Set(TRACE.events[SELECTED]?.caused_by || []);
  $("#timeline").innerHTML = TRACE.events.map((ev, i) => `
    <div class="ev ${i === SELECTED ? "sel" : ""} ${causes.has(ev.seq) ? "caused" : ""}"
         data-i="${i}">
      <div class="seq mono">${ev.seq}</div>
      <div class="label">
        <div class="type t-${ev.type}">${ev.type.replace("_", " ")}</div>
        <span class="name">${escapeHtml(stepName(ev))}</span>
      </div>
      <div class="ms">${ev.body?.context_tokens
        ? `<span class="ctx"><b>${(ev.body.context_tokens / 1000).toFixed(1)}k</b>${
            ev.body.context_delta ? " +" + ((ev.body.context_delta >= 1000)
              ? (ev.body.context_delta / 1000).toFixed(1) + "k" : ev.body.context_delta) : ""}</span>`
        : ev.body?.latency_ms != null ? Math.round(ev.body.latency_ms) + "ms" : ""}</div>
    </div>`).join("");
  const sel = $("#timeline .ev.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

function renderDetail() {
  const ev = TRACE.events[SELECTED];
  if (!ev) return;
  const tabs = panes(ev);
  TAB = Math.min(TAB, tabs.length - 1);
  const shown = tabs[TAB][1];

  const problems = TRACE.integrity.errors.filter((e) => e.seq === ev.seq);
  const blobs = blobsIn(shown);

  $("#detail").innerHTML = `
    ${problems.length ? `<div class="problems"><b>This step failed verification.</b>
      <ul>${problems.map((p) => `${escapeHtml(p.code)} — ${escapeHtml(p.message)}`)
        .map((s) => `<li>${s}</li>`).join("")}</ul></div>` : ""}
    <div class="dh">
      <h2 class="t-${ev.type}">${ev.type.replace("_", " ")} ${escapeHtml(stepName(ev))}</h2>
      <span class="ts mono">seq ${ev.seq} · ${escapeHtml(ev.ts)}</span>
    </div>
    ${renderFacts(ev)}
    <div class="tabs">${tabs.map(([name], i) =>
      `<button class="tab ${i === TAB ? "on" : ""}" data-tab="${i}">${name}</button>`).join("")}</div>
    <pre>${escapeHtml(fmt(shown))}</pre>
    ${blobs.map((d) => `<button class="blobbtn" data-blob="${d}">
        load blob ${d.slice(0, 12)}…</button>`).join(" ")}
    <div class="blobout"></div>
    ${renderWhy(ev)}
    <div class="hashline mono">
      <b>hash</b> ${escapeHtml(ev.hash || "")}<br>
      <b>prev</b> ${escapeHtml(ev.prev_hash || "")}
    </div>`;
}

// The numbers someone came to check, pulled out of the JSON and put first.
// The raw body stays below - the strip is a reading aid, never a substitute.
function renderFacts(ev) {
  const b = ev.body || {};
  const n = (x) => (x >= 10000 ? (x / 1000).toFixed(1) + "k" : String(x));
  const facts = [];
  const add = (label, value) => { if (value !== undefined && value !== null && value !== "") facts.push([label, value]); };

  if (ev.type === "llm_call") {
    add("model", b["gen_ai.request.model"] || b.provider);
    add("tokens", b.usage?.total_tokens != null ? n(b.usage.total_tokens) : null);
    if (b.context_tokens != null) {
      add("context", n(b.context_tokens));
      add("grew by", (b.context_delta >= 0 ? "+" : "") + n(b.context_delta || 0));
    }
    if (b.cost_usd != null) add("cost", "$" + Number(b.cost_usd).toFixed(4));
    if (b.latency_ms != null) add("latency", Math.round(b.latency_ms) + "ms");
    add("stop", b.stop_reason);
  } else if (ev.type === "tool_call") {
    add("tool", b.tool);
    if (b.latency_ms != null) add("latency", Math.round(b.latency_ms) + "ms");
    if (b.error) add("failed", b.error.exception || "error");
    if (b.mutates_environment) add("mutates", "yes");
  } else if (ev.type === "run_end") {
    const t = b.totals || {};
    add("status", b.status);
    add("steps", t.steps);
    if (t.tokens != null) add("tokens", n(t.tokens));
    if (t.cost_usd) add("cost", "$" + Number(t.cost_usd).toFixed(4));
    add("dropped", t.dropped);
    add("inferred", t.adopted);
  } else if (ev.type === "run_start") {
    add("agent", b.agent);
    add("project", b.project);
    if (b.mandate) add("mandate", "declared");
  } else if (ev.type === "retrieval") {
    add("source", b.source);
    add("docs", Array.isArray(b.doc_ids) ? b.doc_ids.length : null);
  }

  if (!facts.length) return "";
  return `<div class="facts">${facts.map(([k, v]) =>
    `<span class="f"><span>${escapeHtml(k)}</span><b>${escapeHtml(v)}</b></span>`).join("")}</div>`;
}

// The causal chain is the differentiator: walk caused_by backwards so "why did
// this happen?" is one glance rather than a scroll through the whole run.
function renderWhy(ev) {
  const chain = [];
  const seen = new Set();
  let cursor = ev;
  while (cursor && cursor.caused_by && cursor.caused_by.length && !seen.has(cursor.seq)) {
    seen.add(cursor.seq);
    const parentSeq = cursor.caused_by[cursor.caused_by.length - 1];
    const parent = TRACE.events.find((e) => e.seq === parentSeq);
    if (!parent) break;
    chain.unshift(parent);
    cursor = parent;
  }
  if (!chain.length) return "";
  const chip = (e) => `<button class="chip" data-goto="${e.seq}">
      <span class="t-${e.type}">${e.type.replace("_", " ")}</span>
      ${escapeHtml(stepName(e))} <span class="mono">#${e.seq}</span></button>`;
  return `<div class="why"><h3>why this happened</h3><div class="chain">
      ${chain.map(chip).join('<span class="arrow">→</span>')}
      <span class="arrow">→</span>
      <button class="chip" data-goto="${ev.seq}"><b>this step</b></button>
    </div></div>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function select(i) {
  if (!TRACE || i < 0 || i >= TRACE.events.length) return;
  if (VIEW === "chapters") { SELECTED = i; TAB = 0; renderChapters(); renderDetail(); return; }
  SELECTED = i; TAB = 0;
  renderTimeline(); renderDetail();
}

document.addEventListener("click", async (e) => {
  const lens = e.target.closest("#viewbar button");
  if (lens) { VIEW = lens.dataset.view; renderTimeline(); return; }
  const header = e.target.closest(".ep > header[data-ep]");
  if (header) {
    const i = Number(header.dataset.ep);
    OPEN_EPISODES.has(i) ? OPEN_EPISODES.delete(i) : OPEN_EPISODES.add(i);
    renderChapters(); return;
  }
  const more = e.target.closest(".ep .more");
  if (more) { VIEW = "all"; select(Number(more.dataset.all)); renderTimeline(); return; }
  const moment = e.target.closest(".mo[data-goto]");
  if (moment) {
    const i = TRACE.events.findIndex((ev) => ev.seq === Number(moment.dataset.goto));
    if (i >= 0) { SELECTED = i; TAB = 0; renderChapters(); renderDetail(); }
    return;
  }
  const ev = e.target.closest(".ev");
  if (ev) return select(Number(ev.dataset.i));
  const tab = e.target.closest(".tab");
  if (tab) { TAB = Number(tab.dataset.tab); return renderDetail(); }
  const goto = e.target.closest("[data-goto]");
  if (goto) {
    const seq = Number(goto.dataset.goto);
    return select(TRACE.events.findIndex((x) => x.seq === seq));
  }
  const blob = e.target.closest("[data-blob]");
  if (blob) {
    blob.disabled = true; blob.textContent = "loading…";
    const text = await fetch(`/api/blob/${blob.dataset.blob}`).then((r) =>
      r.ok ? r.text() : "blob not found next to this trace");
    const out = document.createElement("pre");
    out.textContent = text;
    blob.replaceWith(out);
  }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j") select(SELECTED + 1);
  else if (e.key === "k") select(SELECTED - 1);
  else if (e.key === "g") select(0);
  else if (e.key === "G") select(TRACE.events.length - 1);
  else if (e.key === "r") load();
  else return;
  e.preventDefault();
});

async function load() {
  TRACE = await fetch("/api/trace").then((r) => r.json());
  renderHeader();
  if (!TRACE.events.length) {
    $("#timeline").innerHTML = '<div class="empty">no events in this trace</div>';
    return;
  }
  select(Math.min(SELECTED, TRACE.events.length - 1));
}

// Live follow. The backend re-reads the trace on every request precisely so a
// run still being written can be watched; this is the other half. Re-render
// only when the trace actually grew or its verdict changed, so a reader
// mid-investigation is never yanked around by the poll - and only follow the
// tail if they were already at it, the way a terminal does.
const POLL_MS = 2000;
async function refresh() {
  let next;
  try {
    next = await fetch("/api/trace").then((r) => r.json());
  } catch {
    return; // the server will be back; a live view must outlive a blip
  }
  const grew = next.events.length !== (TRACE?.events.length || 0);
  const verdictChanged = JSON.stringify([next.integrity.ok, next.signature, next.completeness, next.authority])
    !== JSON.stringify([TRACE.integrity.ok, TRACE.signature, TRACE.completeness, TRACE.authority]);
  if (!grew && !verdictChanged) return;
  const atTail = SELECTED >= TRACE.events.length - 1;
  TRACE = next;
  renderHeader();
  select(atTail ? TRACE.events.length - 1 : Math.min(SELECTED, TRACE.events.length - 1));
}

load().then(() => setInterval(refresh, POLL_MS));
</script>
</body>
</html>
