[project]
name = "deposition"
version = "0.1.0.dev0"
description = "A verbatim, tamper-evident record of every AI agent run, with local replay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Canvas_Dev" }]
keywords = ["llm", "agents", "observability", "replay", "audit", "tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# Near-zero deps is a product constraint, not an accident. Keep this list empty.
dependencies = []

[project.optional-dependencies]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]
# Ed25519 (ADR 005). Stdlib has no signing primitives, so this is the one
# capability that cannot ship in the core - it stays an extra.
signing = ["cryptography>=42"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
# openai/anthropic are here so the instrumentation tests run against the real
# response models rather than hand-rolled fakes. The SDK never requires them.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pip-audit>=2.7",
  "httpx>=0.27",
  "openai>=1.40",
  "anthropic>=0.34",
  "cryptography>=42",
]

[project.scripts]
deposition = "deposition.cli:main"
# `deposition verify ...` is a mouthful; depo is the one people will type.
depo = "deposition.cli:main"

[project.urls]
Homepage = "https://github.com/canvas-dev/deposition"
Source = "https://github.com/canvas-dev/deposition"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deposition"]
# Editable installs need the src root on sys.path explicitly; without this
# hatchling emits no .pth and `import deposition` fails in the dev venv.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
